<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chimuelo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: url("fondo-chimuelo.png") no-repeat center center;
      background-size: cover; /* Se adapta al ancho del celular */
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .contenedor {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .dropzone {
      background: rgba(0,0,0,0.5);
      color: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .botones {
      margin-top: 10px;
    }

    button {
      background: #00ff66;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .stickers {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 15px 25px;
    }

    .stickers div {
      text-align: center;
    }

    .stickers img {
      max-width: 120px;
      border-radius: 10px;
    }

    .nombre {
      margin-top: 5px;
      font-weight: bold;
      color: white;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="dropzone">Agregá tu sticker aquí</div>
    <div class="botones">
      <button>Subir sticker</button>
      <button>Quitar</button>
    </div>
  </div>

  <div class="stickers">
    <div>
      <img src="sticker1.png" alt="Sticker 1">
      <div class="nombre">Furia Nocturna Tatiana ✨</div>
    </div>
    <div>
      <img src="sticker2.png" alt="Sticker 2">
      <div class="nombre">Otro sticker</div>
    </div>
  </div>
</body>
</html>
